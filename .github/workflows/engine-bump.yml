# Moves the engine pin to a new xcl release. The xcl release workflow
# dispatches it (event xcl-release) with the new tag; it can also be run by
# hand.
#
# It writes the tag to xcl-ref.txt on the branch engine/<tag>, opens a pull
# request and turns on auto-merge. Every write uses a token of the xcl release
# bot GitHub App, since a pull request opened or merged with the built-in
# GITHUB_TOKEN starts no workflows: the pull request's required checks run,
# and when they pass it merges, and tag.yml tags the merge with the pinned tag,
# which releases the package bundling the new engine. A pull request whose
# checks fail stays open for a maintainer to fix on the same branch.
#
# A second run for the same tag resets the branch from main and updates the
# pull request it already opened, rather than opening another.

name: Engine bump

on:
  repository_dispatch:
    types: [xcl-release]
  workflow_dispatch:
    inputs:
      tag:
        description: The xcl tag to pin, e.g. v0.13.1
        required: true
        type: string

concurrency:
  group: engine-bump-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: Engine bump
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - name: Check the tag
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the tag must look like v1.2.3, got '$TAG'"; exit 1
          fi
          echo "pinning xcl $TAG"

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - name: Push the pin to engine/${{ env.TAG }}
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ "$(tr -d '[:space:]' < xcl-ref.txt)" = "$TAG" ]; then
            echo "main already pins $TAG; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # commit as the App's bot user
          user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "engine/$TAG"
          echo "$TAG" > xcl-ref.txt
          git commit -am "Use xcl engine $TAG"
          git push --force origin "engine/$TAG"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request and turn on auto-merge
        if: steps.push.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch="engine/$TAG"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title "Use xcl engine $TAG" \
              --body "Moves the engine pin to [xcl $TAG](https://github.com/jumppad-labs/xcl/releases/tag/$TAG), so the next package bundles it. Opened by the engine bump workflow; it merges by itself once its checks pass, and merging it releases the package."
          else
            echo "updating pull request #$pr"
          fi
          gh pr merge "$branch" --auto --merge
